<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

		<!-- <link
			rel="stylesheet"
			href="{{ url_for('static', filename='style.css') }}"
			type="text/css" /> -->
		<title>Températures</title>
	</head>
	<body>
		<div class="py-10 px-10 flex flex-col items-center min-h-screen bg-blue-900 text-white">
            {% for temperature in temperatures %}
                <div class="w-64 px-3 py-2 my-3 flex bg-gray-200 text-blue-900 rounded-xl" id="block{{ loop.index }}">
                    <span class="flex-2">{{ temperature[3] }}</span>
                    <span class="flex-1 text-center">{{ temperature[1] }}°</span>
                    <span class="flex-1 text-center">{{ temperature[2] }}%</span>
                </div>
            {% endfor %}
			</div>
		</div>
	</body>
</html>
